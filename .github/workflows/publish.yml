name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm for OIDC support
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"

      - name: Run unit tests
        run: pnpm test:unit

      - name: Build project
        run: pnpm build

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ''

  # The release page is the only record of a version that a reader without npm
  # access can find, and it lapsed for every tag from v0.8.2 to v0.10.0 because
  # nothing created it.
  #
  # It is a SECOND JOB rather than a step, so `contents: write` is never held
  # while `pnpm install`, `pnpm test:unit` and `pnpm build` run third-party code
  # in the publish job — that job keeps `contents: read`. `needs: publish` means
  # a failed publish leaves no page claiming the version shipped. There is no
  # checkout: `gh` works against the API, so the write token never reaches a
  # working tree. Note that a release created with `GITHUB_TOKEN` does not fire
  # `release: published`, so nothing may be keyed on that event.
  #
  # The notes are generated from the merged PRs rather than read from
  # CHANGELOG.md: parsing a section out of the changelog inside YAML is a second
  # place for the release to go wrong, and the changelog is one click away.
  release-page:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create GitHub release
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; nothing to create."
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
